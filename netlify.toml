[build]
  command = "npm run build"
  publish = "dist"

# Jede Seite wird als eigene HTML-Datei vorgerendert; unbekannte Pfade liefern 404.html
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
