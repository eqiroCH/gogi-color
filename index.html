<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f5f2eb" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_CH" />
    <meta property="og:site_name" content="Gogi Color" />
    <meta property="og:image" content="https://gogicolor.ch/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Formulardefinition für Netlify Forms; das sichtbare Formular sendet per fetch an "offerte" -->
    <form name="offerte" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="text" name="kundentyp" />
      <input type="text" name="leistungen" />
      <input type="text" name="objekt" />
      <input type="text" name="groesse" />
      <input type="text" name="decken" />
      <input type="text" name="ort" />
      <input type="text" name="termin" />
      <input type="text" name="datum" />
      <textarea name="nachricht"></textarea>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="telefon" />
      <input type="text" name="kontaktweg" />
      <input type="text" name="quelle" />
      <input type="file" name="foto1" />
      <input type="file" name="foto2" />
      <input type="file" name="foto3" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
